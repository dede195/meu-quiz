<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuizMaster - Jogo de Perguntas e Respostas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }</style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react">
    const { useState, useMemo, useRef } = React;
    const CONFIG_KEY = 'quiz_config_v1';
    const PLAYERS_KEY = 'quiz_players_v1';
    const ADMIN_PASSWORD_KEY = 'quiz_admin_pw_v1';
    const DEFAULT_PASSWORD = 'admin123';
    function uuid() { return (crypto && crypto.randomUUID) ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c==='x'?r:(r&0x3|0x8)).toString(16); }); }
    function loadConfig() { const raw = localStorage.getItem(CONFIG_KEY); if (raw) { try { return JSON.parse(raw); } catch {} } return { gameName: 'QuizMaster', subject: 'Conhecimentos Gerais', questions: [ { id: uuid(), text: 'Qual é a capital do Brasil?', options: { a: 'Rio de Janeiro', b: 'São Paulo', c: 'Brasília', d: 'Salvador' }, correct: 'c' }, { id: uuid(), text: 'Quanto é 7 x 8?', options: { a: '54', b: '56', c: '58', d: '64' }, correct: 'b' }, { id: uuid(), text: 'Quem pintou a Mona Lisa?', options: { a: 'Van Gogh', b: 'Picasso', c: 'Da Vinci', d: 'Michelangelo' }, correct: 'c' }, ], }; }
    const saveConfig = (cfg) => localStorage.setItem(CONFIG_KEY, JSON.stringify(cfg));
    const loadPlayers = () => { const r = localStorage.getItem(PLAYERS_KEY); if (r) { try { return JSON.parse(r); } catch {} } return []; };
    const savePlayer = (p) => { const list = loadPlayers(); list.push(p); localStorage.setItem(PLAYERS_KEY, JSON.stringify(list)); };
    const getAdminPassword = () => localStorage.getItem(ADMIN_PASSWORD_KEY) || DEFAULT_PASSWORD;
    const setAdminPasswordFn = (pw) => localStorage.setItem(ADMIN_PASSWORD_KEY, pw);
    function getFeedback(score, total) { if (total===0) return { title:'Sem perguntas', message:'', emoji:'🤔', color:'from-gray-400 to-gray-600' }; const pct=(score/total)*100; if (pct===100) return { title:'PERFEITO! 🏆', message:'Parabéns! Você acertou TODAS as perguntas!', emoji:'🏆', color:'from-yellow-400 via-amber-500 to-orange-500' }; if (pct>=90) return { title:'EXCELENTE! ⭐', message:'Quase perfeito! Continue assim!', emoji:'⭐', color:'from-emerald-400 to-green-600' }; if (pct>=75) return { title:'MUITO BOM! 🎉', message:'Ótimo desempenho!', emoji:'🎉', color:'from-green-400 to-teal-600' }; if (pct>=60) return { title:'BOM TRABALHO! 👍', message:'Você foi bem!', emoji:'👍', color:'from-blue-400 to-indigo-600' }; if (pct>=40) return { title:'NA MÉDIA 📚', message:'Que tal revisar e tentar novamente?', emoji:'📚', color:'from-indigo-400 to-purple-600' }; if (pct>=20) return { title:'PRECISA MELHORAR 💪', message:'Tá precisando estudar mais!', emoji:'💪', color:'from-orange-400 to-red-500' }; return { title:'VAMOS ESTUDAR! 📖', message:'Bora revisar o conteúdo!', emoji:'📖', color:'from-rose-500 to-pink-600' }; }
    function shuffle(arr) { const a=[...arr]; for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
    function Header({gameName,subject,onHome}){ return (<header className="relative overflow-hidden bg-gradient-to-r from-violet-600 via-purple-600 to-indigo-700 text-white shadow-2xl"><div className="absolute inset-0 opacity-20"><div className="absolute -top-10 -left-10 w-40 h-40 bg-pink-400 rounded-full blur-3xl"></div><div className="absolute top-0 right-0 w-60 h-60 bg-cyan-400 rounded-full blur-3xl"></div></div><div className="relative max-w-6xl mx-auto px-4 sm:px-6 py-5 flex items-center justify-between gap-4"><button onClick={onHome} className="flex items-center gap-3 group"><div className="w-12 h-12 rounded-2xl bg-white/20 backdrop-blur flex items-center justify-center text-2xl shadow-lg group-hover:scale-110 transition">🧠</div><div className="text-left"><h1 className="text-2xl sm:text-3xl font-black tracking-tight drop-shadow">{gameName}</h1><p className="text-xs sm:text-sm text-white/80 font-medium">📚 {subject}</p></div></button></div></header>); }
    function Home({go,shareUrl}){ const [copied,setCopied]=useState(false); const share=(n)=>{ const t=encodeURIComponent('🧠 Venha jogar este Quiz!'); const u=encodeURIComponent(shareUrl); const links={whatsapp:`https://wa.me/?text=${t}%20${u}`,facebook:`https://www.facebook.com/sharer/sharer.php?u=${u}`,twitter:`https://twitter.com/intent/tweet?text=${t}&url=${u}`,telegram:`https://t.me/share/url?url=${u}&text=${t}`}; window.open(links[n],'_blank'); }; const copyLink=async()=>{ try{ await navigator.clipboard.writeText(shareUrl); setCopied(true); setTimeout(()=>setCopied(false),2000); } catch{ prompt('Copie o link:',shareUrl); } }; const isLocal=shareUrl.startsWith('file://'); return (<div className="max-w-3xl mx-auto px-4 py-10"><div className="text-center mb-10"><div className="text-7xl mb-4 animate-bounce">🎯</div><h2 className="text-4xl sm:text-5xl font-black bg-gradient-to-r from-violet-600 to-pink-600 bg-clip-text text-transparent">Bem-vindo ao Quiz!</h2><p className="mt-3 text-lg text-slate-600">Teste seus conhecimentos</p></div><div className="grid sm:grid-cols-2 gap-4 mb-8"><button onClick={()=>go('register')} className="bg-gradient-to-br from-emerald-500 to-teal-600 text-white p-6 rounded-3xl shadow-xl hover:shadow-2xl hover:-translate-y-1 transition-all"><div className="text-5xl mb-2">🎮</div><h3 className="text-xl font-bold">Jogar Agora</h3></button><button onClick={()=>go('ranking')} className="bg-gradient-to-br from-amber-500 to-orange-600 text-white p-6 rounded-3xl shadow-xl hover:shadow-2xl hover:-translate-y-1 transition-all"><div className="text-5xl mb-2">🏆</div><h3 className="text-xl font-bold">Ranking</h3></button></div><div className="bg-white rounded-3xl shadow-xl p-6 mb-6 border border-slate-100"><h3 className="font-bold text-slate-800 mb-3">🔗 Link do Quiz</h3><div className="bg-gradient-to-r from-violet-50 to-pink-50 border-2 border-violet-200 rounded-2xl p-4 mb-3 break-all"><a href={shareUrl} target="_blank" rel="noopener noreferrer" className="text-violet-700 hover:text-pink-600 font-mono text-sm underline">{shareUrl}</a></div><button onClick={copyLink} className={`w-full py-3 rounded-xl font-bold transition shadow-lg ${copied?'bg-green-500 text-white':'bg-slate-800 hover:bg-slate-900 text-white'}`}>{copied?'✅ COPIADO!':'📋 Copiar Link'}</button>{isLocal && <p className="text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded-lg p-3 mt-3">⚠️ Link local. Para outros jogarem, hospede online (GitHub Pages).</p>}</div><div className="bg-white rounded-3xl shadow-xl p-6 mb-6 border border-slate-100"><h3 className="font-bold text-slate-800 mb-3">📤 Compartilhar</h3><div className="flex flex-wrap gap-2"><button onClick={()=>share('whatsapp')} className="flex-1 min-w-[120px] bg-green-500 hover:bg-green-600 text-white px-4 py-2.5 rounded-xl font-medium">💬 WhatsApp</button><button onClick={()=>share('facebook')} className="flex-1 min-w-[120px] bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-xl font-medium">📘 Facebook</button><button onClick={()=>share('twitter')} className="flex-1 min-w-[120px] bg-sky-500 hover:bg-sky-600 text-white px-4 py-2.5 rounded-xl font-medium">🐦 Twitter</button><button onClick={()=>share('telegram')} className="flex-1 min-w-[120px] bg-cyan-500 hover:bg-cyan-600 text-white px-4 py-2.5 rounded-xl font-medium">✈️ Telegram</button></div></div><button onClick={()=>go('admin-login')} className="w-full bg-white hover:bg-slate-50 text-slate-700 border-2 border-slate-200 hover:border-violet-400 p-4 rounded-2xl font-medium shadow-sm">🔐 Área do Criador</button></div>); }
    function AdminLogin({onSuccess,onCancel}){ const [pw,setPw]=useState(''); const [err,setErr]=useState(''); const submit=(e)=>{e.preventDefault(); if(pw===getAdminPassword())onSuccess(); else setErr('Senha incorreta!');}; return (<div className="max-w-md mx-auto px-4 py-10"><div className="bg-white rounded-3xl shadow-2xl p-8"><div className="text-center mb-6"><div className="text-6xl mb-3">🔐</div><h2 className="text-2xl font-black">Área do Criador</h2></div><form onSubmit={submit} className="space-y-4"><input type="password" value={pw} onChange={e=>{setPw(e.target.value); setErr('');}} placeholder="Senha" className="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-violet-500 outline-none" autoFocus />{err && <p className="text-red-500 text-sm">{err}</p>}<p className="text-xs text-slate-400 bg-slate-50 p-3 rounded-lg">💡 Senha padrão: <code>admin123</code></p><div className="flex gap-3"><button type="button" onClick={onCancel} className="flex-1 px-4 py-3 rounded-xl bg-slate-100 font-medium">Voltar</button><button type="submit" className="flex-1 px-4 py-3 rounded-xl bg-gradient-to-r from-violet-600 to-purple-600 text-white font-bold shadow-lg">Entrar</button></div></form></div></div>); }
    function ChangePassword({onClose}){ const [c,setC]=useState(''); const [n,setN]=useState(''); const [e,setE]=useState(''); const sub=(ev)=>{ev.preventDefault(); if(c!==getAdminPassword()){setE('Senha atual incorreta'); return;} if(n.length<4){setE('Mín 4 caracteres'); return;} setAdminPasswordFn(n); alert('🔒 Senha alterada!'); onClose();}; return (<div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50" onClick={onClose}><div className="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl" onClick={ev=>ev.stopPropagation()}><h3 className="font-bold text-xl mb-4">🔑 Mudar Senha</h3><form onSubmit={sub} className="space-y-3"><input type="password" placeholder="Senha atual" value={c} onChange={ev=>setC(ev.target.value)} className="w-full px-4 py-2.5 border-2 border-slate-200 rounded-xl outline-none focus:border-violet-500" /><input type="password" placeholder="Nova senha" value={n} onChange={ev=>setN(ev.target.value)} className="w-full px-4 py-2.5 border-2 border-slate-200 rounded-xl outline-none focus:border-violet-500" />{e && <p className="text-red-500 text-sm">{e}</p>}<div className="flex gap-2"><button type="button" onClick={onClose} className="flex-1 py-2.5 rounded-xl bg-slate-100 font-medium">Cancelar</button><button type="submit" className="flex-1 py-2.5 rounded-xl bg-violet-600 text-white font-bold">Salvar</button></div></form></div></div>); }
    function Admin({config,setConfig,onBack}){ const [local,setLocal]=useState(config); const [showPw,setShowPw]=useState(false); const fileRef=useRef(null); const upd=(p)=>setLocal({...local,...p}); const updQ=(id,p)=>upd({questions:local.questions.map(q=>q.id===id?{...q,...p}:q)}); const addQ=()=>upd({questions:[...local.questions,{id:uuid(),text:'',options:{a:'',b:'',c:'',d:''},correct:'a'}]}); const remQ=(id)=>{if(confirm('Remover?'))upd({questions:local.questions.filter(q=>q.id!==id)});}; const himg=(id,f)=>{if(f.size>2*1024*1024){alert('Máx 2MB');return;} const r=new FileReader(); r.onload=()=>updQ(id,{image:r.result}); r.readAsDataURL(f);}; const save=()=>{setConfig(local); saveConfig(local); alert('✅ Salvo!');}; const exp=()=>{const d=JSON.stringify(local,null,2); const b=new Blob([d],{type:'application/json'}); const u=URL.createObjectURL(b); const a=document.createElement('a'); a.href=u; a.download=`backup-quiz-${new Date().toISOString().slice(0,10)}.json`; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(u); alert('💾 Backup baixado!');}; const imp=(f)=>{const r=new FileReader(); r.onload=()=>{try{const d=JSON.parse(r.result); if(!d.questions)throw new Error(); if(!confirm(`Importar "${d.gameName}" com ${d.questions.length} perguntas?`))return; setLocal(d); setConfig(d); saveConfig(d); alert('✅ Importado!');}catch{alert('❌ Arquivo inválido');}}; r.readAsText(f);}; return (<div className="max-w-4xl mx-auto px-4 py-8"><div className="flex items-center justify-between mb-6 flex-wrap gap-3"><h2 className="text-3xl font-black">⚙️ Painel do Criador</h2><div className="flex gap-2 flex-wrap"><button onClick={()=>setShowPw(true)} className="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 font-medium text-sm">🔑 Mudar Senha</button><button onClick={onBack} className="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 font-medium text-sm">← Voltar</button></div></div><div className="bg-gradient-to-br from-amber-50 to-orange-50 rounded-3xl p-5 shadow-lg border-2 border-amber-200 mb-6"><h3 className="font-bold text-amber-900 mb-2">💾 Backup do Quiz</h3><p className="text-xs text-amber-800 mb-3">Exporte/importe um arquivo .json com todas suas perguntas.</p><div className="flex gap-2 flex-wrap"><button onClick={exp} className="flex-1 min-w-[160px] bg-amber-600 hover:bg-amber-700 text-white px-4 py-3 rounded-xl font-bold shadow">📥 Exportar Backup</button><button onClick={()=>fileRef.current?.click()} className="flex-1 min-w-[160px] bg-white hover:bg-amber-50 text-amber-700 border-2 border-amber-400 px-4 py-3 rounded-xl font-bold">📤 Importar Backup</button><input ref={fileRef} type="file" accept=".json,application/json" className="hidden" onChange={e=>e.target.files?.[0] && imp(e.target.files[0])} /></div></div><div className="bg-gradient-to-br from-violet-50 to-pink-50 rounded-3xl p-6 shadow-lg border border-violet-100 mb-6"><h3 className="font-bold text-slate-700 mb-4">📝 Identificação do Quiz</h3><div className="grid sm:grid-cols-2 gap-4"><div><label className="text-xs font-semibold text-slate-600 uppercase">Nome do Jogo</label><input type="text" value={local.gameName} onChange={e=>upd({gameName:e.target.value})} className="mt-1 w-full px-4 py-3 rounded-xl border-2 border-white bg-white focus:border-violet-500 outline-none font-medium" /></div><div><label className="text-xs font-semibold text-slate-600 uppercase">Disciplina/Tema</label><input type="text" value={local.subject} onChange={e=>upd({subject:e.target.value})} className="mt-1 w-full px-4 py-3 rounded-xl border-2 border-white bg-white focus:border-violet-500 outline-none font-medium" /></div></div></div><div className="space-y-4 mb-6">{local.questions.map((q,idx)=>(<div key={q.id} className="bg-white rounded-3xl shadow-lg p-5 border border-slate-100"><div className="flex items-center justify-between mb-3"><span className="inline-flex items-center gap-2 bg-violet-100 text-violet-700 px-3 py-1 rounded-full text-sm font-bold">Pergunta #{idx+1}</span><button onClick={()=>remQ(q.id)} className="text-red-500 hover:bg-red-50 p-2 rounded-lg text-sm font-medium">🗑️ Remover</button></div><textarea value={q.text} onChange={e=>updQ(q.id,{text:e.target.value})} className="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-violet-500 outline-none mb-3 resize-none" placeholder="Digite a pergunta..." rows={2} /><div className="mb-3"><label className="text-xs font-semibold text-slate-600 uppercase block mb-2">🖼️ Imagem (opcional)</label>{q.image?(<div className="relative inline-block"><img src={q.image} alt="" className="max-h-40 rounded-lg border-2 border-slate-200" /><button onClick={()=>updQ(q.id,{image:undefined})} className="absolute -top-2 -right-2 bg-red-500 text-white w-7 h-7 rounded-full text-xs font-bold shadow-lg">✕</button></div>):(<label className="inline-flex items-center gap-2 px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-lg cursor-pointer text-sm font-medium">📁 Escolher imagem<input type="file" accept="image/*" className="hidden" onChange={e=>e.target.files?.[0] && himg(q.id,e.target.files[0])} /></label>)}</div><div className="flex items-center justify-between mb-2"><p className="text-xs text-slate-500 italic">💡 Clique no botão da letra para marcar a correta</p><span className="text-xs font-bold text-green-600 bg-green-50 px-2 py-1 rounded-lg border border-green-200">Correta: {q.correct.toUpperCase()}</span></div><div className="grid sm:grid-cols-2 gap-2">{['a','b','c','d'].map(l=>(<div key={l} className={`flex items-center gap-2 p-2 rounded-xl border-2 transition ${q.correct===l?'border-green-400 bg-green-50':'border-slate-200'}`}><button onClick={()=>updQ(q.id,{correct:l})} className={`w-9 h-9 rounded-lg font-bold text-sm flex-shrink-0 transition ${q.correct===l?'bg-green-500 text-white ring-2 ring-green-300':'bg-slate-100 text-slate-600 hover:bg-green-200'}`}>{l.toUpperCase()}</button><input type="text" value={q.options[l]} onChange={e=>updQ(q.id,{options:{...q.options,[l]:e.target.value}})} className="flex-1 px-2 py-1.5 bg-transparent outline-none text-sm" placeholder={`Alternativa ${l.toUpperCase()}`} />{q.correct===l && <span className="text-green-600 text-xs font-bold">✓</span>}</div>))}</div></div>))}</div><div className="flex gap-3 flex-wrap sticky bottom-4"><button onClick={addQ} className="flex-1 min-w-[180px] bg-white border-2 border-dashed border-violet-300 hover:border-violet-500 text-violet-700 py-4 rounded-2xl font-bold shadow">➕ Adicionar Pergunta</button><button onClick={save} className="flex-1 min-w-[180px] bg-gradient-to-r from-emerald-500 to-teal-600 text-white py-4 rounded-2xl font-bold shadow-xl">💾 Salvar Tudo</button></div>{showPw && <ChangePassword onClose={()=>setShowPw(false)} />}</div>); }
    function Register({onSubmit,onBack}){ const [n,setN]=useState(''); const [e,setE]=useState(''); const [err,setErr]=useState(''); const sub=(ev)=>{ev.preventDefault(); if(n.trim().length<2){setErr('Digite seu nome');return;} onSubmit(n.trim(),e.trim());}; return (<div className="max-w-md mx-auto px-4 py-10"><div className="bg-white rounded-3xl shadow-2xl p-8"><div className="text-center mb-6"><div className="text-6xl mb-3">👤</div><h2 className="text-2xl font-black">Cadastro do Jogador</h2></div><form onSubmit={sub} className="space-y-4"><div><label className="text-xs font-semibold text-slate-600 uppercase">Nome *</label><input type="text" value={n} onChange={ev=>{setN(ev.target.value); setErr('');}} placeholder="Seu nome" className="mt-1 w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-violet-500 outline-none" autoFocus /></div><div><label className="text-xs font-semibold text-slate-600 uppercase">E-mail (opcional)</label><input type="email" value={e} onChange={ev=>setE(ev.target.value)} placeholder="seu@email.com" className="mt-1 w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-violet-500 outline-none" /></div>{err && <p className="text-red-500 text-sm">{err}</p>}<div className="flex gap-3 pt-2"><button type="button" onClick={onBack} className="flex-1 px-4 py-3 rounded-xl bg-slate-100 font-medium">Voltar</button><button type="submit" className="flex-1 px-4 py-3 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-600 text-white font-bold shadow-lg">Continuar →</button></div></form></div></div>); }
    function SelectCount({available,onSelect,onBack}){ const opts=[10,15,20,25,30]; return (<div className="max-w-2xl mx-auto px-4 py-10"><div className="text-center mb-8"><div className="text-6xl mb-3">🎯</div><h2 className="text-3xl font-black">Quantas perguntas?</h2><p className="text-slate-500 mt-2">{available} disponíveis</p></div><div className="grid grid-cols-2 sm:grid-cols-3 gap-3 mb-3">{opts.map(n=>{const en=available>=n; return (<button key={n} disabled={!en} onClick={()=>onSelect(n)} className={`p-6 rounded-3xl shadow-lg font-bold transition ${en?'bg-gradient-to-br from-violet-500 to-purple-600 text-white hover:scale-105':'bg-slate-100 text-slate-400 cursor-not-allowed'}`}><div className="text-4xl">{n}</div><div className="text-xs uppercase mt-1">perguntas</div></button>);})}<button onClick={()=>onSelect(available)} disabled={available===0} className={`p-6 rounded-3xl shadow-lg font-bold transition ${available>0?'bg-gradient-to-br from-pink-500 to-rose-600 text-white hover:scale-105':'bg-slate-100 text-slate-400 cursor-not-allowed'}`}><div className="text-4xl">∞</div><div className="text-xs uppercase mt-1">todas ({available})</div></button></div><button onClick={onBack} className="w-full mt-4 px-4 py-3 rounded-xl bg-slate-100 font-medium">← Voltar</button></div>); }
    function Play({questions,playerName,onFinish}){ const [idx,setIdx]=useState(0); const [score,setScore]=useState(0); const [sel,setSel]=useState(null); const [rev,setRev]=useState(false); const q=questions[idx]; const prog=((idx+1)/questions.length)*100; const choose=(l)=>{if(rev)return; setSel(l); setRev(true); if(l===q.correct)setScore(s=>s+1);}; const next=()=>{if(idx+1<questions.length){setIdx(idx+1); setSel(null); setRev(false);} else onFinish(score);}; const oc=(l)=>{const b='w-full text-left p-4 rounded-2xl border-2 transition-all flex items-start gap-3 font-medium'; if(!rev) return `${b} border-slate-200 bg-white hover:border-violet-400 hover:shadow-md cursor-pointer`; if(l===q.correct) return `${b} border-green-500 bg-green-50 text-green-800 shadow-lg`; if(l===sel) return `${b} border-red-500 bg-red-50 text-red-800`; return `${b} border-slate-200 bg-slate-50 opacity-60`;}; const lc=(l)=>{const b='w-9 h-9 rounded-lg font-bold text-sm flex items-center justify-center flex-shrink-0'; if(!rev) return `${b} bg-violet-100 text-violet-700`; if(l===q.correct) return `${b} bg-green-500 text-white`; if(l===sel) return `${b} bg-red-500 text-white`; return `${b} bg-slate-200 text-slate-500`;}; return (<div className="max-w-3xl mx-auto px-4 py-6"><div className="flex items-center justify-between mb-3 text-sm"><span className="font-bold text-slate-700">👤 {playerName}</span><span className="font-bold text-violet-700">⭐ {score} pts</span></div><div className="mb-2 flex justify-between text-xs font-semibold text-slate-600"><span>Pergunta {idx+1} de {questions.length}</span><span>{Math.round(prog)}%</span></div><div className="h-2 bg-slate-200 rounded-full overflow-hidden mb-6"><div className="h-full bg-gradient-to-r from-violet-500 to-pink-500 transition-all duration-500 rounded-full" style={{width:`${prog}%`}} /></div><div className="bg-white rounded-3xl shadow-xl p-6 mb-4 border border-slate-100">{q.image && <img src={q.image} alt="" className="w-full max-h-64 object-contain rounded-2xl mb-4 bg-slate-50" />}<h3 className="text-xl sm:text-2xl font-bold text-slate-800 leading-snug">{q.text}</h3></div><div className="space-y-3 mb-4">{['a','b','c','d'].map(l=>(<button key={l} disabled={rev} onClick={()=>choose(l)} className={oc(l)}><span className={lc(l)}>{l.toUpperCase()}</span><span className="flex-1 pt-1">{q.options[l]}</span>{rev && l===q.correct && <span className="text-green-600 pt-1">✓</span>}{rev && l===sel && l!==q.correct && <span className="text-red-600 pt-1">✗</span>}</button>))}</div>{rev && <button onClick={next} className="w-full bg-gradient-to-r from-violet-600 to-purple-600 text-white py-4 rounded-2xl font-bold text-lg shadow-xl">{idx+1<questions.length?'Próxima →':'🏁 Ver Resultado'}</button>}</div>); }
    function Result({playerName,score,total,onRestart,onHome,shareUrl}){ const fb=getFeedback(score,total); const pct=Math.round((score/total)*100); const sh=()=>{const t=`🎯 Fiz ${score}/${total} (${pct}%) no Quiz! ${fb.title}`; window.open(`https://wa.me/?text=${encodeURIComponent(t+' '+shareUrl)}`,'_blank');}; return (<div className="max-w-2xl mx-auto px-4 py-8"><div className={`bg-gradient-to-br ${fb.color} rounded-3xl shadow-2xl p-8 text-white text-center mb-6`}><div className="text-7xl mb-4 animate-bounce">{fb.emoji}</div><h2 className="text-3xl sm:text-4xl font-black mb-2 drop-shadow">{fb.title}</h2><p className="text-white/95 text-lg">{playerName}</p><div className="my-8 flex items-center justify-center gap-6"><div className="bg-white/20 backdrop-blur rounded-2xl px-6 py-4"><div className="text-5xl font-black">{score}</div><div className="text-xs uppercase mt-1">acertos</div></div><div className="text-3xl font-bold opacity-70">/</div><div className="bg-white/20 backdrop-blur rounded-2xl px-6 py-4"><div className="text-5xl font-black">{total}</div><div className="text-xs uppercase mt-1">total</div></div></div><div className="bg-white/20 backdrop-blur rounded-2xl p-4 mb-2"><div className="text-4xl font-black">{pct}%</div><div className="text-xs uppercase">aproveitamento</div></div><p className="text-white/95 mt-4 text-lg">{fb.message}</p></div><div className="grid sm:grid-cols-3 gap-3"><button onClick={sh} className="bg-green-500 hover:bg-green-600 text-white py-3 rounded-2xl font-bold shadow-lg">💬 Compartilhar</button><button onClick={onRestart} className="bg-violet-600 hover:bg-violet-700 text-white py-3 rounded-2xl font-bold shadow-lg">🔄 Jogar Novamente</button><button onClick={onHome} className="bg-slate-200 hover:bg-slate-300 text-slate-800 py-3 rounded-2xl font-bold">🏠 Início</button></div></div>); }
    function Ranking({onBack}){ const players=loadPlayers().map(p=>({...p,pct:p.total>0?p.score/p.total:0})).sort((a,b)=>b.pct-a.pct||b.score-a.score).slice(0,50); const m=['🥇','🥈','🥉']; return (<div className="max-w-2xl mx-auto px-4 py-8"><div className="text-center mb-6"><div className="text-6xl mb-2">🏆</div><h2 className="text-3xl font-black">Ranking</h2></div>{players.length===0?(<div className="bg-white rounded-3xl p-10 text-center shadow-lg"><div className="text-5xl mb-3">🎮</div><p className="text-slate-500">Nenhum jogador ainda!</p></div>):(<div className="bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-100">{players.map((p,i)=>(<div key={i} className={`flex items-center gap-3 p-4 border-b border-slate-100 last:border-b-0 ${i<3?'bg-gradient-to-r from-amber-50 to-transparent':''}`}><div className="w-10 text-center text-2xl font-bold text-slate-400">{m[i]||`${i+1}º`}</div><div className="flex-1 min-w-0"><div className="font-bold text-slate-800 truncate">{p.name}</div><div className="text-xs text-slate-500">{new Date(p.date).toLocaleDateString('pt-BR')}</div></div><div className="text-right"><div className="font-black text-violet-700">{p.score}/{p.total}</div><div className="text-xs text-slate-500">{Math.round(p.pct*100)}%</div></div></div>))}</div>)}<button onClick={onBack} className="w-full mt-6 px-4 py-3 rounded-xl bg-slate-100 font-medium">← Voltar</button></div>); }
    function App(){ const [config,setConfig]=useState(()=>loadConfig()); const [screen,setScreen]=useState('home'); const [pName,setPName]=useState(''); const [pEmail,setPEmail]=useState(''); const [aQ,setAQ]=useState([]); const [fScore,setFScore]=useState(0); const url=useMemo(()=>window.location.href.split('?')[0].split('#')[0],[]); const start=(c)=>{setAQ(shuffle(config.questions).slice(0,c)); setScreen('play');}; const finish=(s)=>{setFScore(s); savePlayer({name:pName,email:pEmail||undefined,score:s,total:aQ.length,date:new Date().toISOString()}); setScreen('result');}; return (<div className="min-h-screen bg-gradient-to-br from-slate-50 via-violet-50 to-pink-50"><Header gameName={config.gameName} subject={config.subject} onHome={()=>setScreen('home')} /><main className="pb-12">{screen==='home' && <Home go={setScreen} shareUrl={url} />}{screen==='admin-login' && <AdminLogin onSuccess={()=>setScreen('admin')} onCancel={()=>setScreen('home')} />}{screen==='admin' && <Admin config={config} setConfig={setConfig} onBack={()=>setScreen('home')} />}{screen==='register' && <Register onSubmit={(n,e)=>{setPName(n); setPEmail(e); setScreen('select-count');}} onBack={()=>setScreen('home')} />}{screen==='select-count' && <SelectCount available={config.questions.length} onSelect={start} onBack={()=>setScreen('register')} />}{screen==='play' && aQ.length>0 && <Play questions={aQ} playerName={pName} onFinish={finish} />}{screen==='result' && <Result playerName={pName} score={fScore} total={aQ.length} shareUrl={url} onRestart={()=>setScreen('select-count')} onHome={()=>setScreen('home')} />}{screen==='ranking' && <Ranking onBack={()=>setScreen('home')} />}</main><footer className="text-center text-xs text-slate-400 py-4">QuizMaster 💜</footer></div>); }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
