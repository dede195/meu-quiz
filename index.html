<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuizMaster 🔥 com Firebase</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }</style>
</head>
<body>
  <div id="root"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
    import { getFirestore, collection, doc, getDocs, setDoc, deleteDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDQccXEExcAjU4SvyKC9sHAxHpFOV95-O8",
      authDomain: "meu-quiz-dede.firebaseapp.com",
      projectId: "meu-quiz-dede",
      storageBucket: "meu-quiz-dede.firebasestorage.app",
      messagingSenderId: "1046984554023",
      appId: "1:1046984554023:web:7611b665e0cc4a55934002"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    window.__FB__ = { db, collection, doc, getDocs, setDoc, deleteDoc, onSnapshot, query, orderBy };
    window.dispatchEvent(new Event('firebase-ready'));
  </script>

  <script type="text/babel" data-presets="react">
    const { useState, useMemo, useRef, useEffect } = React;
    const DEFAULT_PASSWORD = 'admin123';

    function uuid() { return (crypto && crypto.randomUUID) ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0; return (c==='x'?r:(r&0x3|0x8)).toString(16);}); }
    function shuffle(arr){const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a;}
    function getFeedback(score,total){if(total===0)return{title:'Sem perguntas',message:'',emoji:'🤔',color:'from-gray-400 to-gray-600'}; const p=(score/total)*100; if(p===100)return{title:'PERFEITO! 🏆',message:'Parabéns! Você acertou TODAS!',emoji:'🏆',color:'from-yellow-400 via-amber-500 to-orange-500'}; if(p>=90)return{title:'EXCELENTE! ⭐',message:'Quase perfeito!',emoji:'⭐',color:'from-emerald-400 to-green-600'}; if(p>=75)return{title:'MUITO BOM! 🎉',message:'Ótimo desempenho!',emoji:'🎉',color:'from-green-400 to-teal-600'}; if(p>=60)return{title:'BOM TRABALHO! 👍',message:'Você foi bem!',emoji:'👍',color:'from-blue-400 to-indigo-600'}; if(p>=40)return{title:'NA MÉDIA 📚',message:'Que tal revisar?',emoji:'📚',color:'from-indigo-400 to-purple-600'}; if(p>=20)return{title:'PRECISA MELHORAR 💪',message:'Tá precisando estudar mais!',emoji:'💪',color:'from-orange-400 to-red-500'}; return{title:'VAMOS ESTUDAR! 📖',message:'Bora revisar!',emoji:'📖',color:'from-rose-500 to-pink-600'};}

    function getFB(){ return window.__FB__; }
    async function saveQuiz(q){ const {db,doc,setDoc}=getFB(); await setDoc(doc(db,'quizzes',q.id),q); }
    async function deleteQuizFn(id){ const {db,doc,deleteDoc}=getFB(); await deleteDoc(doc(db,'quizzes',id)); }
    async function saveQuestion(q){ const {db,doc,setDoc}=getFB(); await setDoc(doc(db,'questions',q.id),q); }
    async function deleteQuestionFn(id){ const {db,doc,deleteDoc}=getFB(); await deleteDoc(doc(db,'questions',id)); }
    async function saveScore(s){ const {db,doc,setDoc}=getFB(); await setDoc(doc(db,'scores',s.id),s); }
    async function deleteAllScores(){ const {db,collection,getDocs,deleteDoc}=getFB(); const snap=await getDocs(collection(db,'scores')); await Promise.all(snap.docs.map(d=>deleteDoc(d.ref))); }
    async function saveAdminPw(pw){ const {db,doc,setDoc}=getFB(); await setDoc(doc(db,'settings','app'),{adminPassword:pw}); }
    async function seedIfEmpty(){
      const {db,collection,getDocs,doc,setDoc}=getFB();
      const qs=await getDocs(collection(db,'quizzes'));
      if(!qs.empty)return;
      const now=new Date().toISOString();
      const q1={id:uuid(),text:'Qual é a capital do Brasil?',options:{a:'Rio de Janeiro',b:'São Paulo',c:'Brasília',d:'Salvador'},correct:'c',tags:['geografia'],createdAt:now};
      const q2={id:uuid(),text:'Quanto é 7 x 8?',options:{a:'54',b:'56',c:'58',d:'64'},correct:'b',tags:['matemática'],createdAt:now};
      const q3={id:uuid(),text:'Quem pintou a Mona Lisa?',options:{a:'Van Gogh',b:'Picasso',c:'Da Vinci',d:'Michelangelo'},correct:'c',tags:['arte'],createdAt:now};
      const quiz={id:uuid(),name:'Quiz Geral de Exemplo',subject:'Conhecimentos Gerais',description:'Quiz de boas-vindas. Crie os seus na Área do Criador!',questionIds:[q1.id,q2.id,q3.id],isPublic:true,createdAt:now,updatedAt:now,plays:0};
      await Promise.all([
        setDoc(doc(db,'quizzes',quiz.id),quiz),
        setDoc(doc(db,'questions',q1.id),q1),
        setDoc(doc(db,'questions',q2.id),q2),
        setDoc(doc(db,'questions',q3.id),q3),
        setDoc(doc(db,'settings','app'),{adminPassword:DEFAULT_PASSWORD})
      ]);
    }

    function subscribeAll(cb,onErr){
      const {db,collection,doc,onSnapshot,query,orderBy}=getFB();
      const data={quizzes:[],questions:[],scores:[],adminPassword:DEFAULT_PASSWORD};
      const loaded={q:false,qu:false,s:false,set:false};
      const tryEmit=()=>{ if(loaded.q&&loaded.qu&&loaded.s&&loaded.set) cb({...data}); };
      const u1=onSnapshot(collection(db,'quizzes'),snap=>{data.quizzes=snap.docs.map(d=>d.data()); loaded.q=true; tryEmit();},onErr);
      const u2=onSnapshot(collection(db,'questions'),snap=>{data.questions=snap.docs.map(d=>d.data()); loaded.qu=true; tryEmit();},onErr);
      const u3=onSnapshot(query(collection(db,'scores'),orderBy('date','desc')),snap=>{data.scores=snap.docs.map(d=>d.data()); loaded.s=true; tryEmit();},onErr);
      const u4=onSnapshot(doc(db,'settings','app'),snap=>{const v=snap.data(); data.adminPassword=(v&&v.adminPassword)||DEFAULT_PASSWORD; loaded.set=true; tryEmit();},onErr);
      return ()=>{u1();u2();u3();u4();};
    }

    function Header({title,subtitle,onHome}){return(<header className="relative overflow-hidden bg-gradient-to-r from-violet-600 via-purple-600 to-indigo-700 text-white shadow-2xl"><div className="absolute inset-0 opacity-20"><div className="absolute -top-10 -left-10 w-40 h-40 bg-pink-400 rounded-full blur-3xl"></div><div className="absolute top-0 right-0 w-60 h-60 bg-cyan-400 rounded-full blur-3xl"></div></div><div className="relative max-w-6xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between gap-4"><button onClick={onHome} className="flex items-center gap-3 group min-w-0"><div className="w-11 h-11 rounded-2xl bg-white/20 backdrop-blur flex items-center justify-center text-2xl shadow-lg group-hover:scale-110 transition flex-shrink-0">🧠</div><div className="text-left min-w-0"><h1 className="text-xl sm:text-2xl font-black tracking-tight drop-shadow truncate">{title}</h1><p className="text-xs sm:text-sm text-white/80 font-medium truncate">{subtitle}</p></div></button></div></header>);}

    function ShareBox({url,title,compact}){
      const [copied,setCopied]=useState(false);
      const txt=`🧠 Venha jogar o quiz "${title||'Quiz'}"!`;
      const links={whatsapp:`https://wa.me/?text=${encodeURIComponent(txt+' '+url)}`,facebook:`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`,twitter:`https://twitter.com/intent/tweet?text=${encodeURIComponent(txt)}&url=${encodeURIComponent(url)}`,telegram:`https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(txt)}`,linkedin:`https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(url)}`,email:`mailto:?subject=${encodeURIComponent(title||'Quiz')}&body=${encodeURIComponent(txt+'\n\n'+url)}`};
      const open=k=>window.open(links[k],'_blank','noopener');
      const copy=async()=>{try{await navigator.clipboard.writeText(url); setCopied(true); setTimeout(()=>setCopied(false),2000);}catch{prompt('Copie:',url);}};
      const native=async()=>{if(navigator.share){try{await navigator.share({title:title||'Quiz',text:txt,url});}catch{}}else copy();};
      if(compact)return(<div className="flex flex-wrap gap-2"><button onClick={()=>open('whatsapp')} className="bg-green-500 text-white p-2.5 rounded-xl shadow">💬</button><button onClick={()=>open('facebook')} className="bg-blue-600 text-white p-2.5 rounded-xl shadow">📘</button><button onClick={()=>open('twitter')} className="bg-sky-500 text-white p-2.5 rounded-xl shadow">🐦</button><button onClick={()=>open('telegram')} className="bg-cyan-500 text-white p-2.5 rounded-xl shadow">✈️</button><button onClick={native} className="bg-pink-500 text-white p-2.5 rounded-xl shadow">📤</button><button onClick={copy} className={`p-2.5 rounded-xl shadow ${copied?'bg-green-500 text-white':'bg-slate-700 text-white'}`}>{copied?'✅':'🔗'}</button></div>);
      return(<div className="bg-white rounded-3xl shadow-xl p-5 border border-slate-100"><h3 className="font-bold text-slate-800 mb-3 flex items-center gap-2"><span className="text-2xl">📤</span> Compartilhar</h3><div className="bg-gradient-to-r from-violet-50 to-pink-50 border-2 border-violet-200 rounded-2xl p-3 mb-3 break-all"><a href={url} target="_blank" rel="noopener noreferrer" className="text-violet-700 hover:text-pink-600 font-mono text-xs sm:text-sm underline">{url}</a></div><div className="grid grid-cols-3 sm:grid-cols-6 gap-2 mb-3"><button onClick={()=>open('whatsapp')} className="bg-green-500 hover:bg-green-600 text-white px-2 py-2.5 rounded-xl text-sm flex flex-col items-center gap-1"><span className="text-xl">💬</span><span className="text-[10px]">WhatsApp</span></button><button onClick={()=>open('facebook')} className="bg-blue-600 hover:bg-blue-700 text-white px-2 py-2.5 rounded-xl text-sm flex flex-col items-center gap-1"><span className="text-xl">📘</span><span className="text-[10px]">Facebook</span></button><button onClick={()=>open('twitter')} className="bg-sky-500 hover:bg-sky-600 text-white px-2 py-2.5 rounded-xl text-sm flex flex-col items-center gap-1"><span className="text-xl">🐦</span><span className="text-[10px]">Twitter/X</span></button><button onClick={()=>open('telegram')} className="bg-cyan-500 hover:bg-cyan-600 text-white px-2 py-2.5 rounded-xl text-sm flex flex-col items-center gap-1"><span className="text-xl">✈️</span><span className="text-[10px]">Telegram</span></button><button onClick={()=>open('linkedin')} className="bg-blue-700 hover:bg-blue-800 text-white px-2 py-2.5 rounded-xl text-sm flex flex-col items-center gap-1"><span className="text-xl">💼</span><span className="text-[10px]">LinkedIn</span></button><button onClick={()=>open('email')} className="bg-slate-600 hover:bg-slate-700 text-white px-2 py-2.5 rounded-xl text-sm flex flex-col items-center gap-1"><span className="text-xl">✉️</span><span className="text-[10px]">E-mail</span></button></div><div className="grid grid-cols-2 gap-2"><button onClick={native} className="bg-gradient-to-r from-pink-500 to-rose-500 text-white py-3 rounded-xl font-bold shadow-lg">📱 Mais opções</button><button onClick={copy} className={`py-3 rounded-xl font-bold shadow-lg ${copied?'bg-green-500 text-white':'bg-slate-800 text-white'}`}>{copied?'✅ Copiado!':'🔗 Copiar Link'}</button></div><p className="text-[11px] text-slate-400 mt-3 text-center">💡 Para Instagram: copie o link e cole na bio ou stories</p></div>);
    }

    function Gallery({quizzes,questionsCount,onSelectQuiz,onAdminClick}){
      const [search,setSearch]=useState('');
      const filt=quizzes.filter(q=>q.isPublic).filter(q=>{const s=search.toLowerCase().trim(); if(!s)return true; return q.name.toLowerCase().includes(s)||q.subject.toLowerCase().includes(s)||(q.description||'').toLowerCase().includes(s);}).sort((a,b)=>(b.plays||0)-(a.plays||0));
      return(<div className="max-w-5xl mx-auto px-4 py-8"><div className="text-center mb-8"><div className="text-6xl mb-3 animate-bounce">🎯</div><h2 className="text-3xl sm:text-4xl font-black bg-gradient-to-r from-violet-600 to-pink-600 bg-clip-text text-transparent">Escolha um Quiz</h2><p className="mt-2 text-slate-600">{quizzes.length} quiz{quizzes.length!==1?'zes':''} • Conectado ao Firebase 🔥</p></div><div className="mb-6"><input type="text" value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Buscar..." className="w-full px-5 py-3 rounded-2xl border-2 border-slate-200 focus:border-violet-500 outline-none bg-white shadow-sm font-medium" /></div>{filt.length===0?(<div className="bg-white rounded-3xl p-10 text-center shadow-lg"><div className="text-6xl mb-4">📭</div><p className="text-slate-500 mb-4">Nenhum quiz.</p><button onClick={onAdminClick} className="bg-violet-600 text-white px-6 py-3 rounded-xl font-bold">🔐 Criar um Quiz</button></div>):(<div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-8">{filt.map(quiz=>{const c=questionsCount(quiz.id); return(<button key={quiz.id} onClick={()=>onSelectQuiz(quiz)} disabled={c===0} className="text-left bg-white rounded-3xl shadow-lg hover:shadow-2xl border border-slate-100 overflow-hidden hover:-translate-y-1 transition-all disabled:opacity-50 disabled:cursor-not-allowed group"><div className="aspect-video bg-gradient-to-br from-violet-500 via-purple-600 to-pink-500 relative overflow-hidden">{quiz.cover?<img src={quiz.cover} alt="" className="w-full h-full object-cover" />:<div className="absolute inset-0 flex items-center justify-center text-6xl group-hover:scale-110 transition-transform">🧠</div>}<div className="absolute top-2 right-2 bg-white/90 backdrop-blur text-violet-700 text-xs font-bold px-2 py-1 rounded-lg">{c} {c===1?'questão':'questões'}</div></div><div className="p-4"><h3 className="font-black text-lg text-slate-800 truncate">{quiz.name}</h3><p className="text-xs text-violet-600 font-semibold uppercase tracking-wide mt-0.5">📚 {quiz.subject}</p>{quiz.description && <p className="text-sm text-slate-500 mt-2 line-clamp-2">{quiz.description}</p>}<div className="mt-3 flex items-center justify-between text-xs text-slate-400"><span>🎮 {quiz.plays||0} jogadas</span><span className="bg-violet-100 text-violet-700 px-2 py-0.5 rounded-full font-bold">▶️ Jogar</span></div></div></button>);})}</div>)}<button onClick={onAdminClick} className="w-full bg-white hover:bg-slate-50 text-slate-700 border-2 border-slate-200 hover:border-violet-400 p-4 rounded-2xl font-medium transition flex items-center justify-center gap-2 shadow-sm">🔐 Área do Criador</button></div>);
    }

    function AdminLogin({expectedPassword,onSuccess,onCancel}){
      const [pw,setPw]=useState(''); const [err,setErr]=useState('');
      const sub=e=>{e.preventDefault(); if(pw===expectedPassword)onSuccess(); else setErr('Senha incorreta!');};
      return(<div className="max-w-md mx-auto px-4 py-10"><div className="bg-white rounded-3xl shadow-2xl p-8"><div className="text-center mb-6"><div className="text-6xl mb-3">🔐</div><h2 className="text-2xl font-black">Área do Criador</h2></div><form onSubmit={sub} className="space-y-4"><input type="password" value={pw} onChange={e=>{setPw(e.target.value);setErr('');}} placeholder="Senha" className="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-violet-500 outline-none" autoFocus />{err && <p className="text-red-500 text-sm">{err}</p>}<p className="text-xs text-slate-400 bg-slate-50 p-3 rounded-lg">💡 Senha padrão: <code>admin123</code></p><div className="flex gap-3"><button type="button" onClick={onCancel} className="flex-1 px-4 py-3 rounded-xl bg-slate-100 font-medium">Voltar</button><button type="submit" className="flex-1 px-4 py-3 rounded-xl bg-gradient-to-r from-violet-600 to-purple-600 text-white font-bold shadow-lg">Entrar</button></div></form></div></div>);
    }

    function Register({quiz,onSubmit,onBack}){
      const [n,setN]=useState(''); const [e,setE]=useState(''); const [err,setErr]=useState('');
      const sub=ev=>{ev.preventDefault(); if(n.trim().length<2){setErr('Digite seu nome');return;} onSubmit(n.trim(),e.trim());};
      return(<div className="max-w-md mx-auto px-4 py-10"><div className="bg-white rounded-3xl shadow-2xl p-7"><div className="text-center mb-6"><div className="text-6xl mb-3">👤</div><h2 className="text-2xl font-black">Cadastro do Jogador</h2><p className="text-sm text-slate-500 mt-1">Vai jogar: <span className="font-bold text-violet-700">{quiz.name}</span></p></div><form onSubmit={sub} className="space-y-4"><div><label className="text-xs font-semibold text-slate-600 uppercase">Nome *</label><input type="text" value={n} onChange={ev=>{setN(ev.target.value);setErr('');}} placeholder="Seu nome" className="mt-1 w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-violet-500 outline-none" autoFocus /></div><div><label className="text-xs font-semibold text-slate-600 uppercase">E-mail (opcional)</label><input type="email" value={e} onChange={ev=>setE(ev.target.value)} placeholder="seu@email.com" className="mt-1 w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-violet-500 outline-none" /></div>{err && <p className="text-red-500 text-sm">{err}</p>}<div className="flex gap-3 pt-2"><button type="button" onClick={onBack} className="flex-1 px-4 py-3 rounded-xl bg-slate-100 font-medium">Voltar</button><button type="submit" className="flex-1 px-4 py-3 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-600 text-white font-bold shadow-lg">Continuar →</button></div></form></div></div>);
    }

    function SelectCount({available,onSelect,onBack}){
      const opts=[10,15,20,25,30];
      return(<div className="max-w-2xl mx-auto px-4 py-10"><div className="text-center mb-8"><div className="text-6xl mb-3">🎯</div><h2 className="text-3xl font-black">Quantas perguntas?</h2><p className="text-slate-500 mt-2">{available} disponíveis</p></div><div className="grid grid-cols-2 sm:grid-cols-3 gap-3 mb-3">{opts.map(n=>{const en=available>=n; return(<button key={n} disabled={!en} onClick={()=>onSelect(n)} className={`p-6 rounded-3xl shadow-lg font-bold transition ${en?'bg-gradient-to-br from-violet-500 to-purple-600 text-white hover:scale-105':'bg-slate-100 text-slate-400 cursor-not-allowed'}`}><div className="text-4xl">{n}</div><div className="text-xs uppercase mt-1">perguntas</div></button>);})}<button onClick={()=>onSelect(available)} disabled={available===0} className={`p-6 rounded-3xl shadow-lg font-bold transition ${available>0?'bg-gradient-to-br from-pink-500 to-rose-600 text-white hover:scale-105':'bg-slate-100 text-slate-400'}`}><div className="text-4xl">∞</div><div className="text-xs uppercase mt-1">todas ({available})</div></button></div><button onClick={onBack} className="w-full mt-4 px-4 py-3 rounded-xl bg-slate-100 font-medium">← Voltar</button></div>);
    }

    function Play({questions,playerName,onFinish}){
      const [idx,setIdx]=useState(0); const [score,setScore]=useState(0); const [sel,setSel]=useState(null); const [rev,setRev]=useState(false);
      const q=questions[idx]; const prog=((idx+1)/questions.length)*100;
      const choose=l=>{if(rev)return; setSel(l); setRev(true); if(l===q.correct)setScore(s=>s+1);};
      const next=()=>{if(idx+1<questions.length){setIdx(idx+1);setSel(null);setRev(false);}else onFinish(score);};
      const oc=l=>{const b='w-full text-left p-4 rounded-2xl border-2 transition-all flex items-start gap-3 font-medium'; if(!rev)return `${b} border-slate-200 bg-white hover:border-violet-400 cursor-pointer`; if(l===q.correct)return `${b} border-green-500 bg-green-50 text-green-800 shadow-lg`; if(l===sel)return `${b} border-red-500 bg-red-50 text-red-800`; return `${b} border-slate-200 bg-slate-50 opacity-60`;};
      const lc=l=>{const b='w-9 h-9 rounded-lg font-bold text-sm flex items-center justify-center flex-shrink-0'; if(!rev)return `${b} bg-violet-100 text-violet-700`; if(l===q.correct)return `${b} bg-green-500 text-white`; if(l===sel)return `${b} bg-red-500 text-white`; return `${b} bg-slate-200 text-slate-500`;};
      return(<div className="max-w-3xl mx-auto px-4 py-6"><div className="flex items-center justify-between mb-3 text-sm"><span className="font-bold text-slate-700">👤 {playerName}</span><span className="font-bold text-violet-700">⭐ {score} pts</span></div><div className="mb-2 flex justify-between text-xs font-semibold text-slate-600"><span>Pergunta {idx+1} de {questions.length}</span><span>{Math.round(prog)}%</span></div><div className="h-2 bg-slate-200 rounded-full overflow-hidden mb-6"><div className="h-full bg-gradient-to-r from-violet-500 to-pink-500 transition-all duration-500 rounded-full" style={{width:`${prog}%`}} /></div><div className="bg-white rounded-3xl shadow-xl p-5 sm:p-6 mb-4 border border-slate-100">{q.image && <img src={q.image} alt="" className="w-full max-h-64 object-contain rounded-2xl mb-4 bg-slate-50" />}<h3 className="text-xl sm:text-2xl font-bold text-slate-800 leading-snug">{q.text}</h3></div><div className="space-y-3 mb-4">{['a','b','c','d'].map(l=>(<button key={l} disabled={rev} onClick={()=>choose(l)} className={oc(l)}><span className={lc(l)}>{l.toUpperCase()}</span><span className="flex-1 pt-1">{q.options[l]}</span>{rev && l===q.correct && <span className="text-green-600 pt-1">✓</span>}{rev && l===sel && l!==q.correct && <span className="text-red-600 pt-1">✗</span>}</button>))}</div>{rev && <button onClick={next} className="w-full bg-gradient-to-r from-violet-600 to-purple-600 text-white py-4 rounded-2xl font-bold text-lg shadow-xl">{idx+1<questions.length?'Próxima →':'🏁 Ver Resultado'}</button>}</div>);
    }

    function Result({quizName,playerName,score,total,shareUrl,onRestart,onHome}){
      const fb=getFeedback(score,total); const pct=total>0?Math.round((score/total)*100):0;
      return(<div className="max-w-2xl mx-auto px-4 py-8"><div className={`bg-gradient-to-br ${fb.color} rounded-3xl shadow-2xl p-7 sm:p-8 text-white text-center mb-6`}><div className="text-7xl mb-4 animate-bounce">{fb.emoji}</div><h2 className="text-3xl sm:text-4xl font-black mb-2 drop-shadow">{fb.title}</h2><p className="text-white/95 text-lg">{playerName}</p><p className="text-white/80 text-sm mt-1">{quizName}</p><div className="my-7 flex items-center justify-center gap-4 sm:gap-6"><div className="bg-white/20 backdrop-blur rounded-2xl px-5 sm:px-6 py-4"><div className="text-4xl sm:text-5xl font-black">{score}</div><div className="text-xs uppercase tracking-wider mt-1">acertos</div></div><div className="text-3xl font-bold opacity-70">/</div><div className="bg-white/20 backdrop-blur rounded-2xl px-5 sm:px-6 py-4"><div className="text-4xl sm:text-5xl font-black">{total}</div><div className="text-xs uppercase tracking-wider mt-1">total</div></div></div><div className="bg-white/20 backdrop-blur rounded-2xl p-4 mb-2"><div className="text-4xl font-black">{pct}%</div><div className="text-xs uppercase">aproveitamento</div></div><p className="text-white/95 mt-4 text-base sm:text-lg">{fb.message}</p></div><div className="mb-4"><ShareBox url={shareUrl} title={quizName} /></div><div className="grid grid-cols-2 gap-3"><button onClick={onRestart} className="bg-violet-600 hover:bg-violet-700 text-white py-3 rounded-2xl font-bold shadow-lg">🔄 Jogar Novamente</button><button onClick={onHome} className="bg-slate-200 hover:bg-slate-300 text-slate-800 py-3 rounded-2xl font-bold">🏠 Outros Quizzes</button></div></div>);
    }

    function QuestionEditor({question,onClose}){
      const [local,setLocal]=useState(question); const [tagInput,setTagInput]=useState(''); const [saving,setSaving]=useState(false);
      const upd=p=>setLocal({...local,...p});
      const himg=f=>{if(f.size>1.5*1024*1024){alert('Máx 1.5MB');return;} const r=new FileReader(); r.onload=()=>upd({image:r.result}); r.readAsDataURL(f);};
      const addTag=()=>{const t=tagInput.trim().toLowerCase(); if(!t)return; if(!(local.tags||[]).includes(t))upd({tags:[...(local.tags||[]),t]}); setTagInput('');};
      const remTag=t=>upd({tags:(local.tags||[]).filter(x=>x!==t)});
      const save=async()=>{setSaving(true); try{await saveQuestion(local); onClose();}catch(e){alert('❌ '+e.message);} setSaving(false);};
      return(<div className="max-w-3xl mx-auto px-4 py-6"><div className="flex items-center justify-between mb-5"><h2 className="text-2xl font-black">✏️ Editar Questão</h2><button onClick={onClose} className="px-4 py-2 rounded-xl bg-slate-100 font-medium text-sm">← Cancelar</button></div><div className="bg-white rounded-3xl shadow-lg p-5 space-y-4"><div><label className="text-xs font-semibold text-slate-600 uppercase block mb-1">Pergunta</label><textarea value={local.text} onChange={e=>upd({text:e.target.value})} className="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-violet-500 outline-none resize-none" placeholder="Digite a pergunta..." rows={3} /></div><div><label className="text-xs font-semibold text-slate-600 uppercase block mb-2">🖼️ Imagem (máx 1.5MB)</label>{local.image?(<div className="relative inline-block"><img src={local.image} alt="" className="max-h-44 rounded-lg border-2" /><button onClick={()=>upd({image:undefined})} className="absolute -top-2 -right-2 bg-red-500 text-white w-7 h-7 rounded-full text-xs font-bold shadow-lg">✕</button></div>):(<label className="inline-flex items-center gap-2 px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-lg cursor-pointer text-sm font-medium">📁 Escolher imagem<input type="file" accept="image/*" className="hidden" onChange={e=>e.target.files?.[0]&&himg(e.target.files[0])} /></label>)}</div><div><div className="flex items-center justify-between mb-2"><label className="text-xs font-semibold text-slate-600 uppercase">Alternativas</label><span className="text-xs font-bold text-green-600 bg-green-50 px-2 py-1 rounded-lg border border-green-200">Correta: {local.correct.toUpperCase()}</span></div><p className="text-xs text-slate-500 italic mb-2">💡 Clique no botão da letra para marcar a correta</p><div className="space-y-2">{['a','b','c','d'].map(l=>(<div key={l} className={`flex items-center gap-2 p-2 rounded-xl border-2 transition ${local.correct===l?'border-green-400 bg-green-50':'border-slate-200'}`}><button onClick={()=>upd({correct:l})} className={`w-9 h-9 rounded-lg font-bold text-sm flex-shrink-0 transition ${local.correct===l?'bg-green-500 text-white ring-2 ring-green-300':'bg-slate-100 text-slate-600 hover:bg-green-200'}`}>{l.toUpperCase()}</button><input type="text" value={local.options[l]} onChange={e=>upd({options:{...local.options,[l]:e.target.value}})} className="flex-1 px-2 py-2 bg-transparent outline-none text-sm" placeholder={`Alt. ${l.toUpperCase()}`} />{local.correct===l && <span className="text-green-600 text-xs font-bold pr-1">✓</span>}</div>))}</div></div><div><label className="text-xs font-semibold text-slate-600 uppercase block mb-1">🏷️ Tags</label><div className="flex gap-2 mb-2"><input type="text" value={tagInput} onChange={e=>setTagInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&(e.preventDefault(),addTag())} placeholder="ex: matemática..." className="flex-1 px-3 py-2 rounded-lg border-2 border-slate-200 focus:border-violet-500 outline-none text-sm" /><button onClick={addTag} className="px-4 py-2 bg-violet-600 text-white rounded-lg font-bold text-sm">+ Add</button></div><div className="flex gap-1.5 flex-wrap">{(local.tags||[]).map(t=>(<button key={t} onClick={()=>remTag(t)} className="bg-violet-100 hover:bg-red-100 hover:text-red-700 text-violet-700 px-2.5 py-1 rounded-lg text-xs font-bold">#{t} ✕</button>))}</div></div></div><div className="flex gap-3 mt-4"><button onClick={onClose} className="flex-1 py-3 rounded-2xl bg-slate-200 font-bold">Cancelar</button><button onClick={save} disabled={saving} className="flex-1 bg-gradient-to-r from-emerald-500 to-teal-600 text-white py-3 rounded-2xl font-bold shadow-xl disabled:opacity-50">{saving?'💾 Salvando...':'💾 Salvar'}</button></div></div>);
    }

    function QuizEditor({quiz,data,baseUrl,onClose}){
      const [local,setLocal]=useState(quiz); const [picker,setPicker]=useState(false); const [saving,setSaving]=useState(false);
      const upd=p=>setLocal({...local,...p});
      const hcov=f=>{if(f.size>1024*1024){alert('Máx 1MB');return;} const r=new FileReader(); r.onload=()=>upd({cover:r.result}); r.readAsDataURL(f);};
      const remQ=id=>upd({questionIds:local.questionIds.filter(qid=>qid!==id)});
      const up=i=>{if(i===0)return; const a=[...local.questionIds]; [a[i-1],a[i]]=[a[i],a[i-1]]; upd({questionIds:a});};
      const dn=i=>{if(i===local.questionIds.length-1)return; const a=[...local.questionIds]; [a[i],a[i+1]]=[a[i+1],a[i]]; upd({questionIds:a});};
      const addBank=ids=>{const n=[...local.questionIds]; ids.forEach(id=>{if(!n.includes(id))n.push(id);}); upd({questionIds:n}); setPicker(false);};
      const createIn=async()=>{const q={id:uuid(),text:'',options:{a:'',b:'',c:'',d:''},correct:'a',tags:[],createdAt:new Date().toISOString()}; await saveQuestion(q); upd({questionIds:[...local.questionIds,q.id]});};
      const save=async()=>{setSaving(true); try{await saveQuiz({...local,updatedAt:new Date().toISOString()}); onClose();}catch(e){alert('❌ '+e.message);} setSaving(false);};
      const qq=local.questionIds.map(id=>data.questions.find(q=>q.id===id)).filter(Boolean);
      const url=`${baseUrl}?quiz=${local.id}`;
      if(picker)return <QuestionPicker data={data} excludeIds={local.questionIds} onConfirm={addBank} onCancel={()=>setPicker(false)} />;
      return(<div className="max-w-4xl mx-auto px-4 py-6"><div className="flex items-center justify-between mb-5 flex-wrap gap-3"><h2 className="text-2xl font-black">✏️ Editar Quiz</h2><div className="flex gap-2"><button onClick={onClose} className="px-4 py-2 rounded-xl bg-slate-100 font-medium text-sm">← Cancelar</button><button onClick={save} disabled={saving} className="px-4 py-2 rounded-xl bg-emerald-600 text-white font-bold text-sm shadow disabled:opacity-50">{saving?'💾...':'💾 Salvar'}</button></div></div><div className="bg-gradient-to-br from-violet-50 to-pink-50 rounded-3xl p-5 shadow-lg border border-violet-100 mb-4"><h3 className="font-bold text-slate-700 mb-3">📝 Identificação</h3><div className="grid sm:grid-cols-2 gap-3"><div><label className="text-xs font-semibold text-slate-600 uppercase">Nome</label><input type="text" value={local.name} onChange={e=>upd({name:e.target.value})} className="mt-1 w-full px-4 py-2.5 rounded-xl border-2 border-white bg-white focus:border-violet-500 outline-none font-medium" /></div><div><label className="text-xs font-semibold text-slate-600 uppercase">Tema</label><input type="text" value={local.subject} onChange={e=>upd({subject:e.target.value})} className="mt-1 w-full px-4 py-2.5 rounded-xl border-2 border-white bg-white focus:border-violet-500 outline-none font-medium" /></div><div className="sm:col-span-2"><label className="text-xs font-semibold text-slate-600 uppercase">Descrição</label><textarea value={local.description||''} onChange={e=>upd({description:e.target.value})} className="mt-1 w-full px-4 py-2.5 rounded-xl border-2 border-white bg-white focus:border-violet-500 outline-none resize-none" rows={2} /></div><div><label className="text-xs font-semibold text-slate-600 uppercase block mb-1">🖼️ Capa</label>{local.cover?(<div className="relative inline-block"><img src={local.cover} alt="" className="max-h-28 rounded-lg border-2 border-white" /><button onClick={()=>upd({cover:undefined})} className="absolute -top-2 -right-2 bg-red-500 text-white w-6 h-6 rounded-full text-xs font-bold shadow-lg">✕</button></div>):(<label className="inline-flex items-center gap-2 px-3 py-2 bg-white border-2 border-slate-200 rounded-lg cursor-pointer text-sm font-medium">📁 Escolher capa<input type="file" accept="image/*" className="hidden" onChange={e=>e.target.files?.[0]&&hcov(e.target.files[0])} /></label>)}</div><div><label className="text-xs font-semibold text-slate-600 uppercase block mb-1">Visibilidade</label><div className="flex gap-2"><button onClick={()=>upd({isPublic:true})} className={`flex-1 px-3 py-2 rounded-lg text-sm font-bold transition ${local.isPublic?'bg-green-500 text-white':'bg-white border-2 border-slate-200'}`}>🌐 Público</button><button onClick={()=>upd({isPublic:false})} className={`flex-1 px-3 py-2 rounded-lg text-sm font-bold transition ${!local.isPublic?'bg-amber-500 text-white':'bg-white border-2 border-slate-200'}`}>🔒 Privado</button></div></div></div></div><div className="bg-white rounded-3xl shadow-lg p-5 mb-4"><div className="flex items-center justify-between mb-3 flex-wrap gap-2"><h3 className="font-bold text-slate-700">📝 Questões ({qq.length})</h3><div className="flex gap-2 flex-wrap"><button onClick={()=>setPicker(true)} className="bg-blue-500 hover:bg-blue-600 text-white px-3 py-2 rounded-lg text-sm font-bold">📚 Importar do Banco</button><button onClick={createIn} className="bg-violet-600 hover:bg-violet-700 text-white px-3 py-2 rounded-lg text-sm font-bold">➕ Nova</button></div></div>{qq.length===0?(<div className="text-center py-8 text-slate-400"><div className="text-5xl mb-2">📭</div><p className="text-sm">Nenhuma questão.</p></div>):(<div className="space-y-2">{qq.map((q,idx)=>(<QuestionRow key={q.id} idx={idx} question={q} onRemove={()=>remQ(q.id)} onUp={()=>up(idx)} onDown={()=>dn(idx)} isFirst={idx===0} isLast={idx===qq.length-1} />))}</div>)}</div><details className="bg-white rounded-2xl shadow border mb-4"><summary className="cursor-pointer p-4 font-bold text-slate-700 select-none">📤 Compartilhar este quiz</summary><div className="p-4 pt-0"><ShareBox url={url} title={local.name} /></div></details><div className="flex gap-3 sticky bottom-4"><button onClick={onClose} className="flex-1 py-3 rounded-2xl bg-slate-200 font-bold">Cancelar</button><button onClick={save} disabled={saving} className="flex-1 bg-gradient-to-r from-emerald-500 to-teal-600 text-white py-3 rounded-2xl font-bold shadow-xl disabled:opacity-50">{saving?'💾 Salvando...':'💾 Salvar Quiz'}</button></div></div>);
    }

    function QuestionRow({idx,question,onRemove,onUp,onDown,isFirst,isLast}){
      const [open,setOpen]=useState(!question.text); const [local,setLocal]=useState(question); const [saving,setSaving]=useState(false);
      const fileRef=useRef(null);
      const upd=p=>setLocal({...local,...p});
      const himg=f=>{if(f.size>1.5*1024*1024){alert('Máx 1.5MB');return;} const r=new FileReader(); r.onload=()=>upd({image:r.result}); r.readAsDataURL(f);};
      const sav=async()=>{setSaving(true); try{await saveQuestion(local);}catch{alert('❌ Erro');} setSaving(false); setOpen(false);};
      return(<div className="border-2 border-slate-100 rounded-2xl overflow-hidden"><div className="flex items-center gap-2 p-2 bg-slate-50"><span className="bg-violet-100 text-violet-700 px-2 py-1 rounded-lg text-xs font-bold flex-shrink-0">#{idx+1}</span><button onClick={()=>setOpen(!open)} className="flex-1 text-left text-sm font-medium text-slate-700 truncate min-w-0">{local.text||<span className="italic text-slate-400">(clique para editar)</span>}</button><div className="flex gap-1 flex-shrink-0"><button onClick={onUp} disabled={isFirst} className="p-1.5 bg-white rounded text-xs disabled:opacity-30">⬆️</button><button onClick={onDown} disabled={isLast} className="p-1.5 bg-white rounded text-xs disabled:opacity-30">⬇️</button><button onClick={()=>setOpen(!open)} className="p-1.5 bg-white rounded text-xs">{open?'🔼':'✏️'}</button><button onClick={onRemove} className="p-1.5 bg-red-100 text-red-700 rounded text-xs">🗑️</button></div></div>{open && (<div className="p-3 space-y-2 bg-white"><textarea value={local.text} onChange={e=>upd({text:e.target.value})} className="w-full px-3 py-2 rounded-lg border-2 border-slate-200 focus:border-violet-500 outline-none resize-none text-sm" placeholder="Pergunta..." rows={2} /><div className="flex items-center gap-2">{local.image?(<div className="relative inline-block"><img src={local.image} alt="" className="max-h-20 rounded border" /><button onClick={()=>upd({image:undefined})} className="absolute -top-1 -right-1 bg-red-500 text-white w-5 h-5 rounded-full text-[10px]">✕</button></div>):(<button onClick={()=>fileRef.current?.click()} className="text-xs px-3 py-1.5 bg-slate-100 rounded font-medium">🖼️ Imagem</button>)}<input ref={fileRef} type="file" accept="image/*" className="hidden" onChange={e=>e.target.files?.[0]&&himg(e.target.files[0])} /></div><div className="grid sm:grid-cols-2 gap-1.5">{['a','b','c','d'].map(l=>(<div key={l} className={`flex items-center gap-2 p-1.5 rounded-lg border-2 transition ${local.correct===l?'border-green-400 bg-green-50':'border-slate-200'}`}><button onClick={()=>upd({correct:l})} className={`w-7 h-7 rounded font-bold text-xs flex-shrink-0 ${local.correct===l?'bg-green-500 text-white':'bg-slate-100 text-slate-600 hover:bg-green-200'}`}>{l.toUpperCase()}</button><input type="text" value={local.options[l]} onChange={e=>upd({options:{...local.options,[l]:e.target.value}})} className="flex-1 px-1 py-1 bg-transparent outline-none text-xs" placeholder={`Alt. ${l.toUpperCase()}`} /></div>))}</div><button onClick={sav} disabled={saving} className="w-full bg-emerald-500 hover:bg-emerald-600 text-white py-2 rounded-lg text-xs font-bold disabled:opacity-50">{saving?'💾 Salvando...':'💾 Salvar esta questão'}</button></div>)}</div>);
    }

    function QuestionPicker({data,excludeIds,onConfirm,onCancel}){
      const [sel,setSel]=useState([]); const [search,setSearch]=useState(''); const [tag,setTag]=useState('');
      const tags=Array.from(new Set(data.questions.flatMap(q=>q.tags||[]))).sort();
      const av=data.questions.filter(q=>!excludeIds.includes(q.id)).filter(q=>{const s=search.toLowerCase().trim(); const ms=!s||q.text.toLowerCase().includes(s); const mt=!tag||(q.tags||[]).includes(tag); return ms&&mt;});
      const tog=id=>setSel(s=>s.includes(id)?s.filter(x=>x!==id):[...s,id]);
      return(<div className="max-w-3xl mx-auto px-4 py-6"><div className="flex items-center justify-between mb-4"><h2 className="text-2xl font-black">📚 Importar Questões</h2><button onClick={onCancel} className="px-4 py-2 rounded-xl bg-slate-100 font-medium text-sm">← Cancelar</button></div><div className="bg-white rounded-2xl p-3 shadow border mb-3 space-y-2"><input type="text" value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Buscar..." className="w-full px-4 py-2 rounded-xl border-2 border-slate-200 focus:border-violet-500 outline-none text-sm" />{tags.length>0 && (<div className="flex gap-1.5 flex-wrap"><button onClick={()=>setTag('')} className={`px-3 py-1 rounded-lg text-xs font-bold ${tag===''?'bg-violet-600 text-white':'bg-slate-100'}`}>Todas</button>{tags.map(t=>(<button key={t} onClick={()=>setTag(t)} className={`px-3 py-1 rounded-lg text-xs font-bold ${tag===t?'bg-violet-600 text-white':'bg-slate-100'}`}>#{t}</button>))}</div>)}<div className="flex justify-between items-center text-xs"><span className="font-bold text-violet-700">{sel.length} selecionada(s)</span><div className="flex gap-2"><button onClick={()=>setSel(av.map(q=>q.id))} className="text-violet-600 font-bold">Todas</button><span>|</span><button onClick={()=>setSel([])} className="text-slate-600 font-bold">Limpar</button></div></div></div>{av.length===0?(<div className="bg-white rounded-2xl p-8 text-center text-slate-500">Nenhuma questão disponível.</div>):(<div className="space-y-2 mb-4">{av.map(q=>{const s=sel.includes(q.id); return(<button key={q.id} onClick={()=>tog(q.id)} className={`w-full text-left p-3 rounded-xl border-2 transition flex items-center gap-3 ${s?'border-violet-500 bg-violet-50':'bg-white border-slate-200 hover:border-violet-300'}`}><div className={`w-6 h-6 rounded border-2 flex items-center justify-center flex-shrink-0 ${s?'bg-violet-600 border-violet-600 text-white':'border-slate-300'}`}>{s && '✓'}</div><div className="flex-1 min-w-0"><p className="font-bold text-slate-800 text-sm truncate">{q.text||<span className="italic text-slate-400">(vazio)</span>}</p><p className="text-xs text-slate-500 truncate">✅ {q.correct.toUpperCase()}: {q.options[q.correct]}</p></div></button>);})}</div>)}<div className="flex gap-3 sticky bottom-4"><button onClick={onCancel} className="flex-1 py-3 rounded-2xl bg-slate-200 font-bold">Cancelar</button><button onClick={()=>onConfirm(sel)} disabled={sel.length===0} className="flex-1 bg-gradient-to-r from-emerald-500 to-teal-600 text-white py-3 rounded-2xl font-bold shadow-xl disabled:opacity-50">✅ Adicionar {sel.length>0?`(${sel.length})`:''}</button></div></div>);
    }

    function AdminPanel({data,baseUrl,onBack}){
      const [tab,setTab]=useState('quizzes'); const [editQ,setEditQ]=useState(null); const [editQu,setEditQu]=useState(null);
      if(editQ)return <QuizEditor quiz={editQ} data={data} baseUrl={baseUrl} onClose={()=>setEditQ(null)} />;
      if(editQu)return <QuestionEditor question={editQu} onClose={()=>setEditQu(null)} />;
      const TB=({a,o,i,l})=>(<button onClick={o} className={`px-4 py-2 rounded-xl font-bold text-sm whitespace-nowrap transition ${a?'bg-violet-600 text-white shadow-lg':'bg-white border border-slate-200 text-slate-700'}`}>{i} {l}</button>);
      return(<div className="max-w-5xl mx-auto px-4 py-6"><div className="flex items-center justify-between mb-5 flex-wrap gap-3"><h2 className="text-3xl font-black">⚙️ Painel</h2><button onClick={onBack} className="px-4 py-2 rounded-xl bg-slate-100 font-medium text-sm">← Sair</button></div><div className="flex gap-2 mb-6 overflow-x-auto pb-2"><TB a={tab==='quizzes'} o={()=>setTab('quizzes')} i="🎯" l={`Quizzes (${data.quizzes.length})`} /><TB a={tab==='questions'} o={()=>setTab('questions')} i="📝" l={`Banco (${data.questions.length})`} /><TB a={tab==='players'} o={()=>setTab('players')} i="🏆" l={`Jogadores (${data.scores.length})`} /><TB a={tab==='settings'} o={()=>setTab('settings')} i="⚙️" l="Config" /></div>{tab==='quizzes' && <QuizzesTab data={data} onEdit={setEditQ} baseUrl={baseUrl} />}{tab==='questions' && <QuestionsTab data={data} onEdit={setEditQu} />}{tab==='players' && <PlayersTab data={data} />}{tab==='settings' && <SettingsTab data={data} />}</div>);
    }

    function QuizzesTab({data,onEdit,baseUrl}){
      const cr=async()=>{const now=new Date().toISOString(); const q={id:uuid(),name:'Novo Quiz',subject:'Tema',description:'',questionIds:[],isPublic:true,createdAt:now,updatedAt:now,plays:0}; await saveQuiz(q); onEdit(q);};
      const rm=async(id)=>{if(!confirm('Excluir? Questões NÃO serão excluídas.'))return; await deleteQuizFn(id);};
      const dup=async(q)=>{const now=new Date().toISOString(); await saveQuiz({...q,id:uuid(),name:q.name+' (cópia)',createdAt:now,updatedAt:now,plays:0});};
      return(<div><button onClick={cr} className="w-full mb-4 bg-gradient-to-r from-emerald-500 to-teal-600 text-white py-4 rounded-2xl font-bold shadow-xl">➕ Criar Novo Quiz</button>{data.quizzes.length===0?(<div className="bg-white rounded-3xl p-10 text-center shadow-lg"><div className="text-6xl mb-3">📭</div><p className="text-slate-500">Nenhum quiz.</p></div>):(<div className="space-y-3">{data.quizzes.map(quiz=>{const c=quiz.questionIds.filter(id=>data.questions.find(q=>q.id===id)).length; const url=`${baseUrl}?quiz=${quiz.id}`; return(<div key={quiz.id} className="bg-white rounded-3xl shadow-lg p-5"><div className="flex items-start gap-4 mb-3"><div className="w-16 h-16 rounded-2xl bg-gradient-to-br from-violet-500 to-pink-500 flex items-center justify-center text-3xl flex-shrink-0 overflow-hidden">{quiz.cover?<img src={quiz.cover} alt="" className="w-full h-full object-cover" />:'🧠'}</div><div className="flex-1 min-w-0"><h3 className="font-black text-lg text-slate-800 truncate">{quiz.name}</h3><p className="text-xs text-violet-600 font-semibold uppercase">{quiz.subject}</p><div className="flex flex-wrap gap-2 mt-1 text-xs text-slate-500"><span>📝 {c} questões</span><span>🎮 {quiz.plays||0} jogadas</span><span className={quiz.isPublic?'text-green-600':'text-amber-600'}>{quiz.isPublic?'🌐 Público':'🔒 Privado'}</span></div></div></div><div className="grid grid-cols-3 gap-2 mb-3"><button onClick={()=>onEdit(quiz)} className="bg-violet-600 hover:bg-violet-700 text-white py-2 rounded-xl text-sm font-bold">✏️ Editar</button><button onClick={()=>dup(quiz)} className="bg-blue-500 hover:bg-blue-600 text-white py-2 rounded-xl text-sm font-bold">📋 Duplicar</button><button onClick={()=>rm(quiz.id)} className="bg-red-500 hover:bg-red-600 text-white py-2 rounded-xl text-sm font-bold">🗑️ Excluir</button></div><details className="bg-slate-50 rounded-xl"><summary className="cursor-pointer p-3 text-sm font-bold text-slate-700 select-none">📤 Compartilhar</summary><div className="p-3 pt-0"><ShareBox url={url} title={quiz.name} compact /><div className="bg-white border border-slate-200 rounded-lg p-2 mt-2 text-xs font-mono break-all text-slate-600">{url}</div></div></details></div>);})}</div>)}</div>);
    }

    function QuestionsTab({data,onEdit}){
      const [search,setSearch]=useState(''); const [tag,setTag]=useState('');
      const tags=Array.from(new Set(data.questions.flatMap(q=>q.tags||[]))).sort();
      const filt=data.questions.filter(q=>{const s=search.toLowerCase().trim(); const ms=!s||q.text.toLowerCase().includes(s)||Object.values(q.options).some(o=>o.toLowerCase().includes(s)); const mt=!tag||(q.tags||[]).includes(tag); return ms&&mt;});
      const cr=async()=>{const q={id:uuid(),text:'',options:{a:'',b:'',c:'',d:''},correct:'a',tags:[],createdAt:new Date().toISOString()}; await saveQuestion(q); onEdit(q);};
      const rm=async(id)=>{const used=data.quizzes.filter(q=>q.questionIds.includes(id)); if(used.length>0){if(!confirm(`Em ${used.length} quiz(zes). Excluir?`))return;}else if(!confirm('Excluir?'))return; await deleteQuestionFn(id); await Promise.all(data.quizzes.filter(q=>q.questionIds.includes(id)).map(q=>saveQuiz({...q,questionIds:q.questionIds.filter(qid=>qid!==id)})));};
      return(<div><button onClick={cr} className="w-full mb-4 bg-gradient-to-r from-emerald-500 to-teal-600 text-white py-4 rounded-2xl font-bold shadow-xl">➕ Criar Nova Questão</button><div className="bg-white rounded-2xl p-3 shadow border mb-4 space-y-2"><input type="text" value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Buscar..." className="w-full px-4 py-2 rounded-xl border-2 border-slate-200 focus:border-violet-500 outline-none text-sm" />{tags.length>0 && (<div className="flex gap-1.5 flex-wrap"><button onClick={()=>setTag('')} className={`px-3 py-1 rounded-lg text-xs font-bold ${tag===''?'bg-violet-600 text-white':'bg-slate-100'}`}>Todas</button>{tags.map(t=>(<button key={t} onClick={()=>setTag(t)} className={`px-3 py-1 rounded-lg text-xs font-bold ${tag===t?'bg-violet-600 text-white':'bg-slate-100'}`}>#{t}</button>))}</div>)}</div>{filt.length===0?(<div className="bg-white rounded-3xl p-10 text-center shadow-lg"><div className="text-6xl mb-3">🔎</div><p className="text-slate-500">Nenhuma questão.</p></div>):(<div className="space-y-2">{filt.map((q,i)=>{const used=data.quizzes.filter(qz=>qz.questionIds.includes(q.id)).length; return(<div key={q.id} className="bg-white rounded-2xl shadow border p-4 flex items-start gap-3">{q.image && <img src={q.image} alt="" className="w-14 h-14 rounded-lg object-cover flex-shrink-0" />}<div className="flex-1 min-w-0"><p className="font-bold text-slate-800 text-sm truncate">#{i+1} {q.text||<span className="text-slate-400 italic">(vazio)</span>}</p><p className="text-xs text-slate-500 truncate">✅ {q.correct.toUpperCase()}: {q.options[q.correct]}</p><div className="flex gap-1.5 mt-1 flex-wrap">{(q.tags||[]).map(t=>(<span key={t} className="text-[10px] bg-violet-100 text-violet-700 px-1.5 py-0.5 rounded font-bold">#{t}</span>))}{used>0 && <span className="text-[10px] bg-emerald-100 text-emerald-700 px-1.5 py-0.5 rounded font-bold">📌 em {used}</span>}</div></div><div className="flex flex-col gap-1"><button onClick={()=>onEdit(q)} className="bg-violet-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold">✏️</button><button onClick={()=>rm(q.id)} className="bg-red-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold">🗑️</button></div></div>);})}</div>)}</div>);
    }

    function PlayersTab({data}){
      const [f,setF]=useState(''); const filt=data.scores.filter(s=>!f||s.quizId===f);
      const clr=async()=>{if(!confirm('Apagar TODOS?'))return; await deleteAllScores();};
      return(<div><div className="bg-white rounded-2xl p-3 shadow border mb-4 space-y-2"><select value={f} onChange={e=>setF(e.target.value)} className="w-full px-3 py-2 rounded-lg border-2 border-slate-200 focus:border-violet-500 outline-none text-sm"><option value="">Todos os quizzes</option>{data.quizzes.map(q=>(<option key={q.id} value={q.id}>{q.name}</option>))}</select><div className="flex justify-between items-center text-xs"><span className="font-bold text-violet-700">{filt.length} registro(s)</span>{data.scores.length>0 && <button onClick={clr} className="text-red-600 font-bold">🗑️ Apagar tudo</button>}</div></div>{filt.length===0?(<div className="bg-white rounded-3xl p-10 text-center shadow-lg"><div className="text-6xl mb-3">🏆</div><p className="text-slate-500">Nenhum jogador ainda.</p></div>):(<div className="bg-white rounded-3xl shadow-lg overflow-hidden">{filt.map((s,i)=>{const p=s.total>0?(s.score/s.total)*100:0; return(<div key={s.id} className={`flex items-center gap-3 p-4 border-b border-slate-100 last:border-b-0 ${i<3?'bg-gradient-to-r from-amber-50/50 to-transparent':''}`}><div className="w-10 text-center text-2xl">{['🥇','🥈','🥉'][i]||`${i+1}º`}</div><div className="flex-1 min-w-0"><div className="font-bold text-slate-800 truncate">{s.playerName}</div><div className="text-xs text-slate-500 truncate">📚 {s.quizName} • {new Date(s.date).toLocaleDateString('pt-BR')}</div></div><div className="text-right"><div className="font-black text-violet-700">{s.score}/{s.total}</div><div className="text-xs text-slate-500">{Math.round(p)}%</div></div></div>);})}</div>)}</div>);
    }

    function SettingsTab({data}){
      const [pwm,setPwm]=useState(false);
      return(<div className="space-y-4"><div className="bg-gradient-to-br from-orange-50 to-pink-50 rounded-3xl p-5 shadow-lg border-2 border-orange-200"><h3 className="font-bold text-orange-900 mb-1 flex items-center gap-2">🔥 Conectado ao Firebase</h3><p className="text-xs text-orange-800">Todos os dados são compartilhados em tempo real!</p></div><div className="bg-white rounded-3xl p-5 shadow-lg"><h3 className="font-bold text-slate-800 mb-2">🔐 Senha do Admin</h3><button onClick={()=>setPwm(true)} className="bg-violet-600 text-white px-4 py-2.5 rounded-xl font-bold">🔑 Alterar Senha</button></div><div className="bg-white rounded-3xl p-5 shadow-lg"><h3 className="font-bold text-slate-800 mb-3">📊 Estatísticas</h3><div className="grid grid-cols-3 gap-3"><div className="bg-gradient-to-br from-violet-100 to-pink-100 rounded-2xl p-3 text-center"><div className="text-2xl">🎯</div><div className="text-2xl font-black text-violet-700 mt-1">{data.quizzes.length}</div><div className="text-[10px] uppercase font-bold">Quizzes</div></div><div className="bg-gradient-to-br from-violet-100 to-pink-100 rounded-2xl p-3 text-center"><div className="text-2xl">📝</div><div className="text-2xl font-black text-violet-700 mt-1">{data.questions.length}</div><div className="text-[10px] uppercase font-bold">Questões</div></div><div className="bg-gradient-to-br from-violet-100 to-pink-100 rounded-2xl p-3 text-center"><div className="text-2xl">🎮</div><div className="text-2xl font-black text-violet-700 mt-1">{data.scores.length}</div><div className="text-[10px] uppercase font-bold">Jogadas</div></div></div></div>{pwm && <ChangePw data={data} onClose={()=>setPwm(false)} />}</div>);
    }

    function ChangePw({data,onClose}){
      const [c,setC]=useState(''); const [n,setN]=useState(''); const [e,setE]=useState(''); const [s,setS]=useState(false);
      const sub=async(ev)=>{ev.preventDefault(); if(c!==data.adminPassword){setE('Senha atual incorreta');return;} if(n.length<4){setE('Mín 4');return;} setS(true); try{await saveAdminPw(n); alert('🔒 Alterada!'); onClose();}catch{setE('Erro');} setS(false);};
      return(<div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50" onClick={onClose}><div className="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl" onClick={ev=>ev.stopPropagation()}><h3 className="font-bold text-xl mb-4">🔑 Mudar Senha</h3><form onSubmit={sub} className="space-y-3"><input type="password" placeholder="Atual" value={c} onChange={ev=>setC(ev.target.value)} className="w-full px-4 py-2.5 border-2 border-slate-200 rounded-xl outline-none focus:border-violet-500" /><input type="password" placeholder="Nova (mín 4)" value={n} onChange={ev=>setN(ev.target.value)} className="w-full px-4 py-2.5 border-2 border-slate-200 rounded-xl outline-none focus:border-violet-500" />{e && <p className="text-red-500 text-sm">{e}</p>}<div className="flex gap-2"><button type="button" onClick={onClose} className="flex-1 py-2.5 rounded-xl bg-slate-100 font-medium">Cancelar</button><button type="submit" disabled={s} className="flex-1 py-2.5 rounded-xl bg-violet-600 text-white font-bold disabled:opacity-50">{s?'...':'Salvar'}</button></div></form></div></div>);
    }

    function App(){
      const [fbReady,setFbReady]=useState(!!window.__FB__);
      const [data,setData]=useState(null);
      const [error,setError]=useState(null);
      const [screen,setScreen]=useState('gallery');
      const [activeQuiz,setActiveQuiz]=useState(null);
      const [activeQs,setActiveQs]=useState([]);
      const [pName,setPName]=useState(''); const [pEmail,setPEmail]=useState('');
      const [fScore,setFScore]=useState(0);
      const baseUrl=useMemo(()=>window.location.href.split('?')[0].split('#')[0],[]);

      useEffect(()=>{ if(!fbReady){ const h=()=>setFbReady(true); window.addEventListener('firebase-ready',h); return ()=>window.removeEventListener('firebase-ready',h);} },[fbReady]);

      useEffect(()=>{
        if(!fbReady) return;
        let unsub=null;
        (async()=>{
          try{ await seedIfEmpty(); }catch(e){ console.warn(e); }
          unsub=subscribeAll(d=>{
            setData(d);
            const params=new URLSearchParams(window.location.search);
            const qid=params.get('quiz');
            if(qid && !activeQuiz){
              const q=d.quizzes.find(x=>x.id===qid);
              if(q){ setActiveQuiz(q); setScreen('register'); }
            }
          },err=>{ console.error(err); setError(err.message||'Erro de conexão com Firebase'); });
        })();
        return ()=>{ if(unsub) unsub(); };
      },[fbReady]);

      if(error){
        return(<div className="min-h-screen flex items-center justify-center p-6 bg-gradient-to-br from-red-50 to-orange-50"><div className="bg-white rounded-3xl shadow-2xl p-8 max-w-md text-center"><div className="text-6xl mb-3">⚠️</div><h2 className="text-xl font-black text-red-700 mb-2">Erro de conexão</h2><p className="text-sm text-slate-600 mb-4">{error}</p><p className="text-xs text-slate-500 mb-4">Verifique as <strong>regras do Firestore</strong>.</p><button onClick={()=>location.reload()} className="bg-violet-600 text-white px-6 py-3 rounded-xl font-bold">🔄 Tentar novamente</button></div></div>);
      }
      if(!data){
        return(<div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-50 via-violet-50 to-pink-50"><div className="text-center"><div className="text-6xl mb-4 animate-bounce">🧠</div><p className="text-slate-600 font-bold">Conectando ao Firebase...</p><p className="text-xs text-slate-400 mt-2">QuizMaster 🔥</p></div></div>);
      }

      const goHome=()=>{setScreen('gallery'); setActiveQuiz(null); setActiveQs([]); if(window.location.search) window.history.replaceState({},'',baseUrl);};
      const selQuiz=q=>{setActiveQuiz(q); setScreen('register');};
      const start=cnt=>{if(!activeQuiz)return; const all=activeQuiz.questionIds.map(id=>data.questions.find(q=>q.id===id)).filter(Boolean); setActiveQs(shuffle(all).slice(0,cnt)); setScreen('play');};
      const finish=async(score)=>{if(!activeQuiz)return; setFScore(score); const ns={id:uuid(),quizId:activeQuiz.id,quizName:activeQuiz.name,playerName:pName,playerEmail:pEmail||undefined,score,total:activeQs.length,date:new Date().toISOString()}; try{ await saveScore(ns); await saveQuiz({...activeQuiz,plays:(activeQuiz.plays||0)+1}); }catch(e){ console.error(e); } setScreen('result');};
      const qCount=qid=>{const q=data.quizzes.find(x=>x.id===qid); if(!q)return 0; return q.questionIds.filter(id=>data.questions.find(qq=>qq.id===id)).length;};
      const ht=activeQuiz && screen!=='gallery' && screen!=='admin' && screen!=='admin-login'?activeQuiz.name:'QuizMaster';
      const hs=activeQuiz && screen!=='gallery' && screen!=='admin' && screen!=='admin-login'?`📚 ${activeQuiz.subject}`:'Crie. Compartilhe. Desafie. 🔥';
      const url=activeQuiz?`${baseUrl}?quiz=${activeQuiz.id}`:baseUrl;

      return(<div className="min-h-screen bg-gradient-to-br from-slate-50 via-violet-50 to-pink-50"><Header title={ht} subtitle={hs} onHome={goHome} /><main className="pb-12">{screen==='gallery' && <Gallery quizzes={data.quizzes} questionsCount={qCount} onSelectQuiz={selQuiz} onAdminClick={()=>setScreen('admin-login')} />}{screen==='admin-login' && <AdminLogin expectedPassword={data.adminPassword} onSuccess={()=>setScreen('admin')} onCancel={goHome} />}{screen==='admin' && <AdminPanel data={data} baseUrl={baseUrl} onBack={goHome} />}{screen==='register' && activeQuiz && <Register quiz={activeQuiz} onSubmit={(n,e)=>{setPName(n); setPEmail(e); setScreen('select-count');}} onBack={goHome} />}{screen==='select-count' && activeQuiz && <SelectCount available={qCount(activeQuiz.id)} onSelect={start} onBack={()=>setScreen('register')} />}{screen==='play' && activeQs.length>0 && <Play questions={activeQs} playerName={pName} onFinish={finish} />}{screen==='result' && activeQuiz && <Result quizName={activeQuiz.name} playerName={pName} score={fScore} total={activeQs.length} shareUrl={url} onRestart={()=>setScreen('select-count')} onHome={goHome} />}</main><footer className="text-center text-xs text-slate-400 py-4">QuizMaster • Conectado ao Firebase 🔥</footer></div>);
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
